- name: copy the files
  ansible.builtin.copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo 
  
- name: Install Erlang and RabbitMQ server
  ansible.builtin.dnf:
    name:
    - erlang
    - rabbitmq-server
    state: present

- name: enable and start rabbitmq
  ansible.builtin.service:
    name: rabbitmq-server
    state: started
    enabled: yes

- name: Create the roboshop user
  community.rabbitmq.rabbitmq_user:
    user: roboshop
    password: "{{ roboshop_password }}"
    state: present
    update_password: on_create

- name: Grant roboshop full permissions on the default vhost
  community.rabbitmq.rabbitmq_user:
    user: roboshop
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present