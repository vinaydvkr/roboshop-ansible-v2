- name: Create roboshop user
  ansible.builtin.user:
    name: roboshop
    system: true
    home: /app
    shell: /sbin/nologin
    comment: "roboshop system user"
    create_home: false
    state: present

- name: remove the exisiting directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: remove catalogue.zip
  ansible.builtin.file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: create directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download the application archive
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ component }}-v4.zip
    dest: /tmp/{{ component }}.zip

- name: Extract the application archive
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: true